name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Needed to restore Wayfinder/Wayfinder.Engine from the Wayfinder repo's GitHub
      # Packages feed — a repo's own GITHUB_TOKEN doesn't read another repo's packages
      # under a personal account, so this must be a classic PAT with read:packages,
      # stored as a repository secret.
      WAYFINDER_PACKAGES_TOKEN: ${{ secrets.WAYFINDER_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.Umbraco.slnx

      - name: Build
        run: dotnet build Wayfinder.Umbraco.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Wayfinder.Umbraco.slnx -c Release --no-build -o ./artifacts

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/jonnymuir/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
