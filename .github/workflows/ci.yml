name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Umbraco.Client/package-lock.json

      # Wayfinder.Umbraco packs its backoffice bundles (tab + manifests) as static web assets
      # (wwwroot/dist), so they must exist on disk before dotnet build/pack run against them —
      # same pattern as the Wayfinder repo's Wayfinder.Editor, and the same bug class found
      # live there this session when this step was missing from a release workflow (an empty
      # wwwroot/dist silently packs zero static web assets, not an error).
      - name: Install backoffice client dependencies
        working-directory: Wayfinder.Umbraco.Client
        run: npm ci

      - name: Build backoffice client bundles
        working-directory: Wayfinder.Umbraco.Client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.Umbraco.slnx

      - name: Build
        run: dotnet build Wayfinder.Umbraco.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Wayfinder.Umbraco.slnx -c Release --no-build

      # Validates packing still succeeds on every push — the real publish only happens from
      # package-release.yml on a version tag, straight to nuget.org (Trusted Publishing). No
      # GitHub Packages feed: nuget.org is the only publish target.
      - name: Pack
        run: dotnet pack Wayfinder.Umbraco.slnx -c Release --no-build -o ./artifacts

  # The integration suite again, against SQL Server rather than SQLite. Production hosts run on
  # SQL Server, where an unsized Umbraco string column is NVARCHAR(255) (SQLite's TEXT has no
  # limit), so a schema SQLite accepts can still truncate there.
  integration-sqlserver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A throwaway container with a password generated for this run, so no credential lives in
      # the workflow file. Started first so it boots while the build runs.
      - name: Start SQL Server
        run: |
          password="Wf-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          echo "SA_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Wayfinder.Umbraco.Client/package-lock.json

      - name: Build backoffice client bundles
        working-directory: Wayfinder.Umbraco.Client
        run: npm ci && npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Wayfinder.Umbraco.IntegrationTests -c Release

      - name: Wait for SQL Server
        run: |
          for _ in $(seq 1 60); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs sqlserver
          exit 1

      - name: Integration tests on SQL Server
        run: |
          export WAYFINDER_INTEGRATION_SQLSERVER="Server=localhost,1433;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True"
          dotnet test Wayfinder.Umbraco.IntegrationTests -c Release --no-build

  marketplace-description:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Verify MARKETPLACE.md is current
        run: npm run check:marketplace

      - name: Documentation links resolve
        run: node scripts/check-doc-links.mjs

  # Single aggregate check so branch protection only needs to name one CI status check
  # ("all") instead of every job individually — same pattern as the Wayfinder and
  # Umbraco.Prism repos. Add new jobs above to the `needs` list to keep them gating merges.
  all:
    runs-on: ubuntu-latest
    needs: [build-and-pack, integration-sqlserver, marketplace-description]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        run: |
          if [[ "${{ needs.build-and-pack.result }}" == "success" && "${{ needs.integration-sqlserver.result }}" == "success" && "${{ needs.marketplace-description.result }}" == "success" ]]; then
            echo "All checks passed"
            exit 0
          else
            echo "Some checks failed"
            exit 1
          fi
