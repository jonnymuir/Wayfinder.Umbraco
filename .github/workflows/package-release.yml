name: Package Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify package version matches release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"

          VERSION=$(grep -oE '<Version>[^<]+</Version>' Wayfinder.Umbraco/Wayfinder.Umbraco.csproj | head -1 | sed -E 's#</?Version>##g')
          echo "Wayfinder.Umbraco.csproj version: $VERSION"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match Wayfinder.Umbraco.csproj <Version>${VERSION}</Version>. Bump the csproj before tagging, since a mismatch would silently try to re-push an already-published version to NuGet."
            exit 1
          fi

      # No `cache:` input here on purpose — a release workflow must not restore a cache a
      # PR could have poisoned. With no cache configured there is nothing to exploit, so
      # the residual zizmor cache-poisoning hit on setup-node is a false positive.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'

      - name: Verify MARKETPLACE.md is current
        run: npm run check:marketplace

      # Same static-web-asset build step as ci.yml — required here too, independently, since
      # this workflow packs+pushes to nuget.org on its own path. Confirmed live this session
      # (in the Wayfinder repo) that skipping this silently ships an empty wwwroot/dist rather
      # than failing the build.
      - name: Install backoffice client dependencies
        working-directory: Wayfinder.Umbraco.Client
        run: npm ci

      - name: Build backoffice client bundles
        working-directory: Wayfinder.Umbraco.Client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Wayfinder.Umbraco.slnx

      - name: Build
        run: dotnet build Wayfinder.Umbraco.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Wayfinder.Umbraco.slnx -c Release --no-build -o artifacts

      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wayfinder-umbraco-nuget
          path: artifacts/*.nupkg

      # gh is pre-installed on the runner — no third-party action needed. GITHUB_TOKEN
      # needs contents: write, granted on this job.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes

      # Trusted Publishing: exchanges this run's GitHub OIDC token for a NuGet.org API key
      # that's minted fresh and expires in an hour — no long-lived secret stored anywhere.
      # Requires a Trusted Publishing policy on nuget.org scoped to this exact repo +
      # workflow file (jonnymuir/Wayfinder.Umbraco, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
