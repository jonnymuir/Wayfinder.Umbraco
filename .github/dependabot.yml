# Dependabot version updates. Security updates (PRs for a known CVE) are enabled
# separately in repo settings and need no entry here.
#
# Weekly and grouped so a quiet week produces at most one PR per ecosystem. nuget.org is
# the only feed (see NuGet.config). `cooldown` holds a newly published version back for
# 7 days so a poisoned release has a window to be spotted and yanked before it reaches
# a PR here.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # This package targets one Umbraco major at a time (see CLAUDE.md § Umbraco version
      # support). A new Umbraco major is a deliberate, matrix-tested migration, not an
      # auto-PR; minor/patch within the supported major still flow. uSync's major tracks
      # Umbraco's, so it's held the same way.
      - dependency-name: "Umbraco.Cms*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uSync*"
        update-types: ["version-update:semver-major"]
      # OpenIddict.* is pinned in Wayfinder.Umbraco.csproj PrivateAssets="all" purely to
      # compile against — the host resolves it at *its* Umbraco's version at runtime, so this
      # pin must never exceed what Umbraco ships (a 7.6.0 -> 7.6.1 bump regressed the reference
      # app with a ReflectionTypeLoadException). It moves only in lockstep with Umbraco.
      - dependency-name: "OpenIddict*"
      # AwesomeAssertions is intentionally held at 7.x — the community fork of FluentAssertions
      # 7.2.0 that keeps the FluentAssertions namespace/assembly name, so it is a drop-in with
      # zero test edits. 8.x / 9.x rename to the AwesomeAssertions namespace (touching every test
      # file for no functional gain). Bump only as a deliberate namespace migration.
      - dependency-name: "AwesomeAssertions"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      root:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/Wayfinder.Umbraco.Client"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      backoffice-client:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The backoffice bundle's major is bound to the Umbraco major it ships against —
      # bumped deliberately alongside the server side, not by auto-PR.
      - dependency-name: "@umbraco-cms/backoffice"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/tests/demo"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      tests-demo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
